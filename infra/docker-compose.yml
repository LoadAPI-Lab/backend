name: loadapi

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-loadapi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-loadapi}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loadapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loadapi}
      POSTGRES_DB: ${POSTGRES_DB:-loadapi}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    image: ghcr.io/loadapi-lab/backend/core:${IMAGE_TAG:-dev}
    build:
      context: ../apps/core
      target: prod
    restart: unless-stopped
    env_file:
      - path: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-loadapi}:${POSTGRES_PASSWORD:-loadapi}@postgres:5432/${POSTGRES_DB:-loadapi}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-loadapi}:${RABBITMQ_PASSWORD:-loadapi}@rabbitmq:5672/
    ports:
      - "127.0.0.1:${CORE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/loadapi-lab/backend/worker:${IMAGE_TAG:-dev}
    build:
      context: ../apps/worker
    restart: unless-stopped
    env_file:
      - path: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-loadapi}:${RABBITMQ_PASSWORD:-loadapi}@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  testserver:
    image: ghcr.io/loadapi-lab/backend/testserver:${IMAGE_TAG:-dev}
    build:
      context: ../apps/testserver
    environment:
      STALL_EVERY: ${STALL_EVERY:-}
      STALL_FOR: ${STALL_FOR:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TESTSERVER_PORT:-8080}:8080"

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data: